openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Farm Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: farm
    description: Farm profile
  - name: crops
    description: Crop management
  - name: workers
    description: Worker management
  - name: workGroups
    description: Work groups (activity folders)
  - name: attendance
    description: Daily attendance records
  - name: dailyWork
    description: Daily work progress
  - name: expenses
    description: Farm expenses
  - name: sprays
    description: Spray events
  - name: harvests
    description: Harvest records
  - name: loans
    description: Worker loans
  - name: loanPayments
    description: Loan payment records
  - name: reports
    description: Aggregated reports
  - name: dashboard
    description: Dashboard summaries
  - name: ai
    description: AI-powered features (disease detection, agri technician)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Farm Profile
  /farm/profile:
    get:
      operationId: getFarmProfile
      tags: [farm]
      summary: Get farm profile
      responses:
        "200":
          description: Farm profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmProfile"
        "404":
          description: Not found
    post:
      operationId: createFarmProfile
      tags: [farm]
      summary: Create farm profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmProfile"
    patch:
      operationId: updateFarmProfile
      tags: [farm]
      summary: Update farm profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmProfile"

  # Crops
  /crops:
    get:
      operationId: listCrops
      tags: [crops]
      summary: List all crops
      responses:
        "200":
          description: List of crops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Crop"
    post:
      operationId: createCrop
      tags: [crops]
      summary: Create a crop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crop"

  /crops/{id}:
    get:
      operationId: getCrop
      tags: [crops]
      summary: Get a crop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Crop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crop"
        "404":
          description: Not found
    patch:
      operationId: updateCrop
      tags: [crops]
      summary: Update a crop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crop"
    delete:
      operationId: deleteCrop
      tags: [crops]
      summary: Delete a crop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Blocks
  /blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      summary: List all farm blocks
      responses:
        "200":
          description: List of blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Block"
    post:
      operationId: createBlock
      tags: [blocks]
      summary: Create a farm block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"

  /blocks/{id}:
    get:
      operationId: getBlock
      tags: [blocks]
      summary: Get a farm block
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          description: Not found
    patch:
      operationId: updateBlock
      tags: [blocks]
      summary: Update a farm block
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          description: Not found
    delete:
      operationId: deleteBlock
      tags: [blocks]
      summary: Delete a farm block
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Workers
  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List all workers
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Create a worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/{id}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get a worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
    patch:
      operationId: updateWorker
      tags: [workers]
      summary: Update a worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
    delete:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete a worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /workers/{id}/wages:
    get:
      operationId: getWorkerWages
      tags: [workers]
      summary: Get monthly wage summary for a worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Wage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerWageSummary"

  # Work Groups
  /work-groups:
    get:
      operationId: listWorkGroups
      tags: [workGroups]
      summary: List all work groups
      responses:
