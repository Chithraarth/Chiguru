          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyWorkUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWork"
    delete:
      operationId: deleteDailyWork
      tags: [dailyWork]
      summary: Delete daily work record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Expenses
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - name: cropId
          in: query
          required: false
          schema: { type: integer }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: startDate
          in: query
          required: false
          schema: { type: string }
        - name: endDate
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Sprays
  /sprays:
    get:
      operationId: listSprays
      tags: [sprays]
      summary: List spray events
      parameters:
        - name: cropId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of sprays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Spray"
    post:
      operationId: createSpray
      tags: [sprays]
      summary: Create a spray event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprayInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spray"

  /sprays/{id}:
    patch:
      operationId: updateSpray
      tags: [sprays]
      summary: Update a spray event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprayUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spray"
    delete:
      operationId: deleteSpray
      tags: [sprays]
      summary: Delete a spray event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Harvests
  /harvests:
    get:
      operationId: listHarvests
      tags: [harvests]
      summary: List harvest records
      parameters:
        - name: cropId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of harvests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Harvest"
    post:
      operationId: createHarvest
      tags: [harvests]
      summary: Create a harvest record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarvestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Harvest"

  /harvests/{id}:
    patch:
      operationId: updateHarvest
      tags: [harvests]
      summary: Update a harvest record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
