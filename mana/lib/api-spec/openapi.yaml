          description: Work group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkGroup"
        "404":
          description: Not found
    patch:
      operationId: updateWorkGroup
      tags: [workGroups]
      summary: Update a work group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkGroupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkGroup"
    delete:
      operationId: deleteWorkGroup
      tags: [workGroups]
      summary: Delete a work group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Attendance
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: workGroupId
          in: query
          required: false
          schema: { type: integer }
        - name: date
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Create an attendance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/{id}:
    patch:
      operationId: updateAttendance
      tags: [attendance]
      summary: Update attendance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Delete attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Daily Work
  /daily-work:
    get:
      operationId: listDailyWork
      tags: [dailyWork]
      summary: List daily work records
      parameters:
        - name: workGroupId
          in: query
          required: false
          schema: { type: integer }
        - name: date
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of daily work records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyWork"
    post:
      operationId: createDailyWork
      tags: [dailyWork]
      summary: Create daily work record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyWorkInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWork"

  /daily-work/{id}:
    patch:
      operationId: updateDailyWork
      tags: [dailyWork]
      summary: Update daily work record
      parameters:
        - name: id
          in: path
