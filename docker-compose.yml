services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiguru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chiguru
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chiguru-net

  api-server:
    image: ${DOCKERHUB_USER}/chiguru-api-server:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://chiguru:${POSTGRES_PASSWORD}@postgres:5432/chiguru
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL}
    networks:
      - chiguru-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: ${DOCKERHUB_USER}/chiguru-nginx:latest
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - chiguru-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Polls Docker Hub every 5 minutes; only touches containers labeled
  # watchtower.enable=true above (api-server, nginx) — leaves postgres and
  # certbot alone since those images aren't rebuilt by the CI pipeline.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done'

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:

networks:
  chiguru-net:
